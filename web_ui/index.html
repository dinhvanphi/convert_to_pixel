<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Artwork Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="background-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Pixel Art <span>Generator</span></h1>
            <p>Configure parameters to convert your images into pixel art data.</p>
        </header>

        <main class="dashboard">
            <section class="upload-section glass-panel">
                <div class="upload-area" id="upload-area">
                    <input type="file" id="file-input" accept="image/*" hidden>
                    <div class="upload-content" id="upload-content">
                        <i class="ph ph-upload-simple"></i>
                        <h3>Upload Image</h3>
                        <p>Drag & drop or click to browse</p>
                    </div>
                    <div class="preview-container" id="preview-container" style="display: none;">
                        <img id="image-preview" src="" alt="Preview">
                        <button class="btn-icon remove-btn" id="remove-btn" title="Remove image">
                            <i class="ph ph-x"></i>
                        </button>
                    </div>
                </div>
            </section>

            <section class="config-section glass-panel">
                <div class="form-grid">
                    <!-- Grid Size -->
                    <div class="form-group full-width">
                        <label>Grid Size (Resolution)</label>
                        <div class="radio-group" id="grid-group">
                            <label class="radio-card">
                                <input type="radio" name="grid" value="24">
                                <div class="card-content">
                                    <span class="value">24x24</span>
                                    <span class="desc">Đơn giản</span>
                                </div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="grid" value="32" checked>
                                <div class="card-content">
                                    <span class="value">32x32</span>
                                    <span class="desc">Cân bằng</span>
                                </div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="grid" value="48">
                                <div class="card-content">
                                    <span class="value">48x48</span>
                                    <span class="desc">Chi tiết</span>
                                </div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="grid" value="64">
                                <div class="card-content">
                                    <span class="value">64x64</span>
                                    <span class="desc">Chi tiết</span>
                                </div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="grid" value="96">
                                <div class="card-content">
                                    <span class="value">96x96</span>
                                    <span class="desc">Rất chi tiết</span>
                                </div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="grid" value="128">
                                <div class="card-content">
                                    <span class="value">128x128</span>
                                    <span class="desc">Tối đa</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Colors -->
                    <div class="form-group full-width">
                        <label for="colors">Palette Colors <span class="val-display" id="color-val">20</span></label>
                        <div class="slider-container">
                            <input type="range" id="colors" min="2" max="64" value="20" class="custom-slider">
                            <div class="slider-labels">
                                <span>2</span>
                                <span>64</span>
                            </div>
                        </div>
                    </div>

                    <!-- ID & Title -->
                    <div class="form-group">
                        <label for="artwork-id">Artwork ID</label>
                        <input type="text" id="artwork-id" placeholder="Default: filename">
                    </div>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="Default: filename">
                    </div>

                    <!-- Category & Preview Image -->
                    <div class="form-group">
                        <label for="category">Category</label>
                        <div class="select-wrapper">
                            <select id="category">
                                <option value="animal">Animal</option>
                                <option value="flowers">Flowers</option>
                                <option value="trending">Trending</option>
                                <option value="popular" selected>Popular</option>
                                <option value="fantasy">Fantasy</option>
                                <option value="space">Space</option>
                                <option value="ocean">Ocean</option>
                            </select>
                            <i class="ph ph-caret-down"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="preview">Preview Image</label>
                        <input type="text" id="preview" value="img_home1" placeholder="img_home1">
                    </div>

                    <!-- Output & Append -->
                    <div class="form-group">
                        <label for="output">Output JSON</label>
                        <input type="text" id="output" value="artworks.json" placeholder="artworks.json">
                    </div>
                    <div class="form-group flex-center">
                        <label class="switch-container">
                            <span class="label-text">Append to JSON</span>
                            <input type="checkbox" id="append">
                            <span class="switch"></span>
                        </label>
                    </div>
                </div>
            </section>
        </main>

        <section class="result-section glass-panel mt-2">
        <section class="result-section glass-panel mt-2">
            <div class="action-container" style="display: flex; justify-content: center;">
                <button class="btn primary" id="run-btn" style="background: #10b981; font-size: 1.1rem; padding: 0.8rem 2.5rem;">
                    <i class="ph ph-play-circle" style="font-size: 1.4rem;"></i> Generate Artwork
                </button>
            </div>

            <!-- Execution Results -->
            <div id="execution-results" class="execution-results mt-2" style="display: none;">
                <h3 style="margin-bottom: 1rem;">Execution Results</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="generated-preview">
                        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Preview Generated PNG</label>
                        <img id="generated-image" src="" alt="Generated Preview" style="width: 100%; border-radius: 12px; border: 1px solid var(--panel-border); background: #000;">
                    </div>
                    <div class="download-actions" style="display: flex; flex-direction: column; justify-content: center; gap: 1rem;">
                        <a id="download-json" href="#" download class="btn primary" style="background: var(--accent); justify-content: center;">
                            <i class="ph ph-download-simple"></i> Download JSON
                        </a>
                        <a id="download-img" href="#" download class="btn primary" style="justify-content: center;">
                            <i class="ph ph-image"></i> Download Preview Image
                        </a>
                    </div>
                </div>
                <div class="logs-container mt-2">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Terminal Logs</label>
                    <div class="code-block" style="font-size: 0.85rem; color: #94a3b8; max-height: 200px; overflow-y: auto;">
                        <code id="execution-logs"></code>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
